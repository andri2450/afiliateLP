<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Dashboard Produk</title>
<style>
:root{--bg:#fafafa;--c:#fff;--t:#1c1c1c;--m:#666;--a:#ee4d2d;--b:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--c:#1d1d1d;--t:#f2f2f2;--m:#a0a0a0;--b:#333}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t);padding:16px}
.w{max-width:760px;margin:auto}.box{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:16px}
input,textarea{width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit;margin:4px 0 10px}
label{font-size:.85rem;color:var(--m)}button{background:var(--a);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
button.g{background:var(--b);color:var(--t)}.row{display:flex;gap:8px}.row>*{flex:1}
.it{display:flex;gap:10px;align-items:center;border-top:1px solid var(--b);padding:10px 0}.it img{width:52px;height:52px;object-fit:cover;border-radius:8px}
.it div{flex:1;font-size:.9rem}#st{color:var(--m);font-size:.85rem;min-height:1.2em}
</style></head><body><div class="w">
<h1>Dashboard Produk</h1>
<div class="box"><label>Password admin</label><input id="pw" type="password"></div>
<div class="box">
<label>Link afiliasi Shopee</label>
<div class="row"><input id="url" placeholder="https://shope.ee/xxxx"><button id="gen" style="flex:0 0 auto;margin:4px 0 10px">Generate</button></div>
<div id="st"></div>
<label>Judul</label><input id="title">
<label>Harga (angka, rupiah)</label><input id="price" inputmode="numeric">
<label>Deskripsi</label><textarea id="desc" rows="4"></textarea>
<label>URL gambar</label><input id="img">
<button id="save">Simpan ke Landing Page</button>
</div>
<div class="box"><b>Produk tersimpan</b><div id="list"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const hd=()=>({'content-type':'application/json','x-admin-password':$('pw').value});
$('pw').value=sessionStorage.getItem('pw')||'';
$('pw').onchange=()=>{sessionStorage.setItem('pw',$('pw').value);load()};
const st=t=>$('st').textContent=t;
const e=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
  const l=await (await fetch('/api/products')).json();
  $('list').innerHTML=l.map(p=>`<div class="it">${p.image?`<img src="${e(p.image)}" referrerpolicy="no-referrer">`:''}<div>${e(p.title)}<br><small>${e(p.price)}</small></div><button class="g" data-id="${p.id}">Hapus</button></div>`).join('')||'<p>Belum ada.</p>';
  $('list').querySelectorAll('button').forEach(b=>b.onclick=async()=>{if(!confirm('Hapus produk ini?'))return;await fetch('/api/products?id='+b.dataset.id,{method:'DELETE',headers:hd()});load()});
}
$('gen').onclick=async()=>{
  st('Mengambil data & menulis ulang…');
  const r=await fetch('/api/generate',{method:'POST',headers:hd(),body:JSON.stringify({url:$('url').value.trim()})});
  const d=await r.json();
  if(!r.ok)return st(d.error);
  $('title').value=d.title||'';$('desc').value=d.description||'';$('img').value=d.image||'';$('price').value=d.price||'';
  st(d.scraped?'Selesai. Cek dan edit bila perlu, lalu simpan.':'Shopee memblokir pengambilan otomatis. Isi judul, harga, deskripsi, dan gambar manual.');
};
$('save').onclick=async()=>{
  const r=await fetch('/api/products',{method:'POST',headers:hd(),body:JSON.stringify({title:$('title').value,price:$('price').value,description:$('desc').value,image:$('img').value,link:$('url').value.trim()})});
  const d=await r.json();
  if(!r.ok)return st(d.error);
  ['url','title','price','desc','img'].forEach(i=>$(i).value='');st('Tersimpan.');load();
};
load();
</script></body></html>
